name: Discover card deals

# DISABLED (schedule commented out) — requested directly: this made one
# sold-comps API call per browsed listing (~25 per category, 2 categories)
# every hour, ~32,000 calls/month on its own, against a paid API metered
# at 2,000-10,000 calls/month. That's more than the entire budget for an
# exploratory feature that isn't the core "search a specific card, find
# price differences" workflow. `workflow_dispatch` is left in place so it
# can still be run manually (Actions tab -> "Discover card deals" ->
# "Run workflow") if wanted occasionally, and the schedule line can be
# uncommented to turn it back on if the sold-comps budget allows it later.
on:
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Call discover endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.DEAL_FINDER_URL }}/api/cards/discover" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed"
            exit 1
          fi
