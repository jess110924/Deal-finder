name: Check card watchlist

# DISABLED (schedule commented out) — requested directly: decided to
# stick to manual search as the primary workflow and put the whole
# sold-comps budget toward that, rather than split it with an unattended
# recurring check. At 5 listings/check this still projected to ~7,200
# sold-comps calls/month for a single watched card, which alone eats most
# of even the 10,000/month paid tier. Adding a card to the watchlist
# still runs one immediate check right away (see the watchlist route's
# POST handler) — that's a single, user-triggered check, not a recurring
# background job, so it stays. `workflow_dispatch` is left in place to
# run this manually (Actions tab -> "Check card watchlist" -> "Run
# workflow") if wanted occasionally, and the schedule line can be
# uncommented to turn automatic checks back on later.
on:
  # schedule:
  #   - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-watchlist endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.DEAL_FINDER_URL }}/api/cards/check-watchlist" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed"
            exit 1
          fi
