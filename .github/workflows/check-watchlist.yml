name: Check card watchlist

# RE-ENABLED — originally disabled over sold-comps API cost (~7,200
# calls/month for a single watched card against a 10,000/month paid
# tier). That reasoning no longer applies: the app reverted from sold
# comps back to PriceCharting (see "A brief detour through sold comps,
# and back" in the README), which isn't billed per-request the same way.
# Requested directly, as the highest-leverage way to actually beat other
# buyers to an underpriced listing — a human re-searching manually can't
# compete with a check every 30 minutes. `workflow_dispatch` stays
# available for an on-demand run from the Actions tab too.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-watchlist endpoint
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.DEAL_FINDER_URL }}/api/cards/check-watchlist" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $response"
          cat /tmp/response.json
          if [ "$response" -ge 400 ]; then
            echo "Request failed"
            exit 1
          fi
